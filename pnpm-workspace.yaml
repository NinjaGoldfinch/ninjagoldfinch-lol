allowBuilds:
  esbuild: true
# Keep pnpm's own version out of pnpm-lock.yaml. Otherwise pnpm 12 writes it as
# a leading YAML document, and GitHub's dependency graph reads only that one,
# hiding every app dependency from Dependabot. Corepack still enforces the
# packageManager pin. See ADR-005.
pmOnFail: ignore
# openapi-typescript 7 declares typescript ^5 but generates correctly with 6.
# See ADR-006.
peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: '6'
