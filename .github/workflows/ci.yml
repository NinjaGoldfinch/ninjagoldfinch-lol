name: CI

# ADR-050 (task DEP-01). Runs the gate, scripts/check.sh (what `just check`
# runs), on every pull request and on main. Pull requests from this repository
# run on the self-hosted Proxmox runner; one from a fork runs on a hosted
# runner instead, so outside code never reaches it (the repository also requires
# approval before an outside contributor's workflows run). The release workflow
# calls it before building a release (ADR-052).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: just check
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || fromJSON('["self-hosted","linux","proxmox"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # pnpm at the version package.json's packageManager names.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The unit tests load the server env; the example's values are placeholders.
      - run: cp .env.example .env
      - run: scripts/check.sh
