name: Release

# ADR-052, ADR-057. Push a tag such as v1.0.0, matching package.json's version
# (ADR-051), to publish the site as the deploy tarballs ninja-deploy unpacks
# (one top-level directory with build/, package.json, LICENSE and
# version.json): ninjagoldfinch-lol.tar.gz built for https://ninjagoldfinch.lol
# and ninjagoldfinch-lol-staging.tar.gz built for
# https://staging.ninjagoldfinch.lol, with SHA256SUMS and build provenance. The
# gate runs first; once published, the release deploys to staging through
# deploy.yml. A release created with this workflow's token starts no other
# workflow, so the deploy is called here rather than on `release: published`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    runs-on: [self-hosted, linux, proxmox]
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Refuses a tag that is not package.json's version, then builds and packs.
      - run: scripts/package.sh "$GITHUB_REF_NAME" dist

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/ninjagoldfinch-lol.tar.gz
            dist/ninjagoldfinch-lol-staging.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/ninjagoldfinch-lol.tar.gz
            dist/ninjagoldfinch-lol-staging.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: [self-hosted, linux, proxmox]
    timeout-minutes: 10
    permissions:
      contents: write
    # The runner's workspace persists between jobs; runner.temp is emptied
    # after each one, so only this release's files are published.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/dist

      - name: Create release
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --strict -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ninjagoldfinch-lol.tar.gz ninjagoldfinch-lol-staging.tar.gz SHA256SUMS

  # Every release goes to staging without approval; prod is deployed by hand
  # with deploy.yml and waits for the owner (ADR-053, ADR-057).
  staging:
    name: Deploy to staging
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      env: staging
      version: ${{ github.ref_name }}
