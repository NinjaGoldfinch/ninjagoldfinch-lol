name: Deploy

# ADR-053, ADR-057. Deploys a release to staging or prod through the shared
# pipeline, NinjaGoldfinch/ninja-actions/deploy: it checks the environment's
# tarball against SHA256SUMS (both from release.yml, ADR-052), uploads it to
# /srv/ninjagoldfinch-lol/releases/ unless the host already has it, and
# activates it. The host restarts the site, waits for /healthz to report the
# new version (ADR-051) and rolls back by itself if it does not. Rolling back on
# purpose is deploying the previous version: it is still on the host, so there
# is no upload. release.yml calls this with env staging for every release, with
# no approval; the prod environment waits for the owner's approval.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Where to deploy
        type: choice
        options: [staging, prod]
        default: staging
      version:
        description: Release tag, e.g. v1.0.0
        required: true
  workflow_call:
    inputs:
      env:
        description: staging or prod
        type: string
        required: true
      version:
        description: Release tag, e.g. v1.0.0
        type: string
        required: true

permissions:
  contents: read

env:
  SERVICE: ninjagoldfinch-lol
  # Each environment has its own build: the origin is fixed at build time (ADR-014).
  ASSET: ${{ inputs.env == 'staging' && 'ninjagoldfinch-lol-staging.tar.gz' || 'ninjagoldfinch-lol.tar.gz' }}

jobs:
  # A called workflow takes any string; an unknown environment name would be
  # created on the fly, without protection, before the deploy job could refuse it.
  check:
    name: Check the environment
    runs-on: [self-hosted, linux, proxmox]
    timeout-minutes: 2
    steps:
      - env:
          ENV_NAME: ${{ inputs.env }}
        run: |
          case $ENV_NAME in
          staging | prod) echo "deploying to $ENV_NAME" ;;
          *) echo "::error::unknown environment '$ENV_NAME' (want staging or prod)"; exit 1 ;;
          esac

  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.env }}
    needs: check
    runs-on: [self-hosted, linux, proxmox]
    environment: ${{ inputs.env }}
    concurrency:
      group: deploy-${{ inputs.env }}
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: NinjaGoldfinch/ninja-actions/deploy@v1
        with:
          service: ${{ env.SERVICE }}
          version: ${{ inputs.version }}
          asset: ${{ env.ASSET }}
          host: ${{ vars.DEPLOY_HOST }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
