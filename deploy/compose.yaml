# The site on a LAN preview VM, published on port 3000. riot-proxy runs
# elsewhere; PROXY_URL in deploy/.env points at it. Dormant: production runs
# without Docker (ADR-010, ADR-038).
services:
  web:
    build:
      context: ..
      # From deploy/.env; baked into the build (ADR-014).
      args:
        ORIGIN: ${ORIGIN:?set ORIGIN in deploy/.env}
    image: ninjagoldfinch-web:local
    restart: unless-stopped
    env_file: .env
    ports: ['3000:3000']
