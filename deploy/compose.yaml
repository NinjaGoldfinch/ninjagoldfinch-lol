# The site on a LAN VM, published on port 3000. riot-proxy runs elsewhere;
# PROXY_URL in deploy/.env points at it. P5 adds cloudflared and stops
# publishing the port.
services:
  web:
    build:
      context: ..
      # From deploy/.env; baked into the build (ADR-014).
      args:
        ORIGIN: ${ORIGIN:?set ORIGIN in deploy/.env}
    image: ninjagoldfinch-web:local
    restart: unless-stopped
    env_file: .env
    ports: ['3000:3000']
