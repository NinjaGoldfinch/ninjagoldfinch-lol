# /etc/systemd/system/ninjagoldfinch-lol.service.d/ninja-deploy.conf
#
# Runs the release ninja-deploy activated, /srv/ninjagoldfinch-lol/current
# (ADR-054), instead of the build in the /opt/ninjagoldfinch-lol checkout. The
# unit's user, EnvironmentFile and hardening stay as they are. Delete this file,
# then `systemctl daemon-reload` and restart, to go back to the checkout.
[Service]
WorkingDirectory=/srv/ninjagoldfinch-lol/current
ExecStart=
ExecStart=/usr/bin/node /srv/ninjagoldfinch-lol/current/build
# /var/lib/ninjagoldfinch-lol, owned by the unit's user and writable under
# ProtectSystem=strict; systemd sets STATE_DIRECTORY to it. Each start records
# its version there, and a start with another version sends `deployed`; a raised
# `proxy_unreachable` is kept there too, across restarts (ADR-063).
StateDirectory=ninjagoldfinch-lol
